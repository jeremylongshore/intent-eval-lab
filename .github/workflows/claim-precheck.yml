name: bd-claim-precheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/claim-precheck-reusable.yml
    with:
      # The gate script is unchanged on main; callers pin the source commit
      # rather than following a mutable branch from an untrusted PR.
      gate_ref: 0f81b2466abf5e9ea85399957be9a631ee60094a
