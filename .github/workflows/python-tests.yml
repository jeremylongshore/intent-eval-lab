name: Python Tests

on:
  # Required branch-protection gate: the `ruff lint + format` job runs on EVERY
  # PR to main, not just PRs that touch Python paths. A path-filtered required
  # check is SKIPPED on unrelated PRs and never reports, blocking the PR
  # forever. The push: trigger keeps its path filter (no required-check
  # semantics on push). mypy + pytest stay advisory (continue-on-error in their
  # jobs) — they may run on every PR but never block.
  # No `branches:` filter on purpose: with `branches: [main]` a stacked PR whose
  # base is another feature branch gets no checks at all. Push builds stay on main.
  pull_request:
  push:
    branches: [main]
    paths:
      - "research/phase-a-0-baseline/**/*.py"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # L2 lint + format (REQUIRED) and type-check (mypy stays advisory — gradual
  # typing; the runners import third-party SDKs without stubs in all envs).
  # ---------------------------------------------------------------------------
  lint:
    name: ruff lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir 'ruff==0.16.9'
      - run: ruff check research/phase-a-0-baseline/scripts/ research/phase-a-0-baseline/tests/
      - run: ruff format --check research/phase-a-0-baseline/scripts/ research/phase-a-0-baseline/tests/

  typecheck:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir 'mypy==2.3.1' pyyaml 'pytest==9.1.1'
      - run: mypy research/phase-a-0-baseline/scripts/

  # ---------------------------------------------------------------------------
  # L3 unit tests + subprocess coverage (advisory job, shared 60% floor).
  # ---------------------------------------------------------------------------
  pytest:
    name: pytest + coverage (research/phase-a-0-baseline)
    runs-on: ubuntu-latest
    # Keep this job advisory; branch-protection policy is unchanged. The shared
    # 60% coverage floor now applies here as well as locally. Offline analysis
    # and scorer-adapter contracts reach it without provider keys or the external
    # marketplace checkout. The four real-validator integrations still skip when
    # that checkout is absent; synthetic adapter data is not integration evidence.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --no-cache-dir 'pytest==9.1.1' 'pytest-cov==7.1.0' 'coverage==7.16.1' pyyaml 'numpy==2.3.2' 'scipy==1.16.1'
      - name: Run pytest with subprocess-aware coverage
        env:
          # Tells child Pythons (subprocess.run from smoke tests) to auto-init
          # coverage. sitecustomize.py at repo root reads this and registers.
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
          # Make sitecustomize.py findable by child Pythons via PYTHONPATH
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # A test FAILURE still fails this step — `coverage run -m pytest`
          # propagates pytest's exit code, and that pass/fail is the real signal.
          coverage run -m pytest research/phase-a-0-baseline/tests/ -v --tb=short
          coverage combine
          # Enforce pyproject.toml's unchanged fail_under=60 within this lane.
          coverage report
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # L3 unit tests for the scripts/ gate machinery (the spec-drift detectors, the
  # SAK state machines, the projection freshness driver).
  #
  # These 190 tests existed and ran NOWHERE: pyproject lists scripts/tests in
  # testpaths, but the only pytest job in CI invoked
  # `pytest research/phase-a-0-baseline/tests/` explicitly, so scripts/tests was
  # never collected on any PR — including the tests added with the FF#2 repair
  # that this machinery's correctness now rests on. A regression lock that does
  # not run is not a lock, so it gets its own job here.
  #
  # NOT continue-on-error, unlike the coverage job above: these are offline,
  # deterministic, and dependency-light (stdlib + pytest + pyyaml), so there is
  # no environment limit to excuse a failure. Promoting it to a REQUIRED check in
  # branch protection is an owner action.
  # ---------------------------------------------------------------------------
  scripts-tests:
    name: pytest (scripts/ gate machinery)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # jsonschema is load-bearing here, not optional: the SAK modules' own
      # cmd_self_test() exits 1 with "jsonschema not installed" when it is absent,
      # and pytest.importorskip only shields the tests that import it directly.
      # Without it 9 tests fail for an environment reason and the job's signal is
      # noise. (Caught on this job's first CI run.)
      - run: pip install --no-cache-dir 'pytest==9.1.1' pyyaml jsonschema
      - name: Run scripts/ unit tests
        run: pytest scripts/tests/ -v --tb=short
      - name: Vendored capture provenance integrity
        run: python3 scripts/check-vendor-meta-integrity.py

  hygiene-preservation:
    name: Captured evidence byte preservation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: pip install --no-cache-dir 'pre-commit==4.3.0'
      # Hook dependencies may download here; the fixture never runs live models
      # or changes the repository's captured evidence.
      - name: Exercise configured hooks against immutable and authored fixtures
        run: npm exec --yes --package npm@10.9.2 -- python3 scripts/check-hygiene-preservation.py
